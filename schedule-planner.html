<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1日スケジュールプランナー</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, system-ui, sans-serif;
  background: #0d1117;
  color: #e6e8ed;
  min-height: 100vh;
}

.header {
  background: #0d1117;
  border-bottom: 1px solid #21262d;
  padding: 16px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
}
.header h1 {
  font-size: 1.3rem;
  letter-spacing: 0.08em;
  background: linear-gradient(90deg, #818cf8, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header p { font-size: 0.82rem; color: #6b7280; }

.app {
  display: flex;
  gap: 20px;
  padding: 20px;
  max-width: 1060px;
  margin: 0 auto;
}

.charts-area {
  display: flex;
  gap: 20px;
  flex: 1;
  justify-content: center;
  align-items: flex-start;
}

.chart-card {
  background: #161b22;
  border: 1px solid #21262d;
  border-radius: 12px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.chart-card h2 {
  font-size: 0.9rem;
  color: #8b949e;
  letter-spacing: 0.05em;
}

.sidebar {
  width: 260px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.form-card {
  background: #161b22;
  border: 1px solid #21262d;
  border-radius: 12px;
  padding: 16px;
}
.form-card h3 {
  font-size: 0.85rem;
  color: #8b949e;
  margin-bottom: 12px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}
.form-group label { font-size: 0.78rem; color: #6b7280; }
.form-group input {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 6px;
  padding: 8px 10px;
  color: #e6e8ed;
  font-size: 0.85rem;
  width: 100%;
}
.form-group input:focus {
  outline: none;
  border-color: #818cf8;
}

.btn-add {
  width: 100%;
  padding: 8px;
  background: linear-gradient(90deg, #818cf8, #38bdf8);
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 0.85rem;
  cursor: pointer;
  font-weight: 600;
}
.btn-add:hover { opacity: 0.85; }

.activity-list { display: flex; flex-direction: column; gap: 6px; }
.activity-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: #0d1117;
  border-radius: 6px;
  font-size: 0.82rem;
}
.activity-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.activity-name { flex: 1; }
.activity-time { font-size: 0.75rem; color: #6b7280; }
.btn-del {
  background: none;
  border: none;
  color: #6b7280;
  cursor: pointer;
  font-size: 0.9rem;
  padding: 0 2px;
  line-height: 1;
}
.btn-del:hover { color: #f87171; }

@media (max-width: 700px) {
  .app { flex-direction: column; }
  .charts-area { flex-direction: column; align-items: center; }
  .sidebar { width: 100%; }
}
</style>
</head>
<body>
<header class="header">
  <h1>1日スケジュールプランナー</h1>
  <p>1日の予定をドーナツグラフで可視化</p>
</header>

<div class="app">
  <div class="charts-area">
    <div class="chart-card">
      <h2>AM（0:00 〜 12:00）</h2>
      <svg id="svg-am" viewBox="0 0 300 300" width="280" height="280"></svg>
    </div>
    <div class="chart-card">
      <h2>PM（12:00 〜 24:00）</h2>
      <svg id="svg-pm" viewBox="0 0 300 300" width="280" height="280"></svg>
    </div>
  </div>

  <div class="sidebar">
    <div class="form-card">
      <h3>活動を追加</h3>
      <div class="form-group">
        <label for="inp-name">活動名</label>
        <input type="text" id="inp-name" placeholder="例: 朝食">
      </div>
      <div class="form-group">
        <label for="inp-start">開始時刻</label>
        <input type="time" id="inp-start" value="09:00">
      </div>
      <div class="form-group">
        <label for="inp-end">終了時刻</label>
        <input type="time" id="inp-end" value="10:00">
      </div>
      <button class="btn-add" id="btn-add">＋ 追加</button>
    </div>

    <div class="form-card">
      <h3>活動リスト</h3>
      <div class="activity-list" id="activity-list"></div>
    </div>
  </div>
</div>

<script>
const CX = 150, CY = 150, R = 120, INNER_R = 75, LABEL_R = 142;
const COLORS = [
  "#818cf8","#38bdf8","#34d399","#fbbf24","#f87171",
  "#a78bfa","#22d3ee","#4ade80","#fb923c","#e879f9"
];

let activities = [];
let tapStateAM = null; // null | { startMin: number }
let tapStatePM = null;
let hoverMinAM = null;
let hoverMinPM = null;

// Note: not safe for 'touchend' (touches is empty); use changedTouches directly for touchend.
function getSVGCoords(svg, event) {
  const rect = svg.getBoundingClientRect();
  const scaleX = 300 / rect.width;
  const scaleY = 300 / rect.height;
  const src = event.touches ? event.touches[0] : event;
  return {
    x: (src.clientX - rect.left) * scaleX,
    y: (src.clientY - rect.top) * scaleY,
  };
}

function xyToMin(x, y, periodStart) {
  const dx = x - CX, dy = y - CY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < INNER_R - 10 || dist > R + 10) return null;
  let deg = Math.atan2(dy, dx) * 180 / Math.PI + 90;
  if (deg < 0) deg += 360;
  const raw = periodStart + (deg / 360) * 720;
  const snapped = Math.round(raw / 30) * 30;
  return Math.min(Math.max(snapped, periodStart), periodStart + 720);
}

function timeStrToMin(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

function minToTimeStr(min) {
  return `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
}

function addActivity() {
  const nameEl = document.getElementById("inp-name");
  const startEl = document.getElementById("inp-start");
  const endEl = document.getElementById("inp-end");

  const name = nameEl.value.trim();
  if (!name) { alert("活動名を入力してください"); return; }
  if (!startEl.value || !endEl.value) { alert("時刻を入力してください"); return; }

  const startMin = timeStrToMin(startEl.value);
  const endMin = timeStrToMin(endEl.value);
  if (endMin === startMin) { alert("開始時刻と終了時刻が同じです"); return; }

  activities.push({ id: Date.now(), name, startMin, endMin, color: "" });
  reassignColors();
  saveToStorage();
  renderAll();
  nameEl.value = "";
}

function deleteActivity(id) {
  activities = activities.filter(a => a.id !== id);
  reassignColors();
  saveToStorage();
  renderAll();
}

function reassignColors() {
  activities.forEach((a, i) => { a.color = COLORS[i % COLORS.length]; });
}

function saveToStorage() {
  localStorage.setItem("schedule-planner-v1", JSON.stringify(activities));
}

function loadFromStorage() {
  try {
    const saved = localStorage.getItem("schedule-planner-v1");
    if (saved) activities = JSON.parse(saved);
  } catch (e) {
    activities = [];
    localStorage.removeItem("schedule-planner-v1");
  }
}

function timeToAngle(totalMinutes, periodStart) {
  const minutes = totalMinutes - periodStart;
  return (minutes / 720) * 360 - 90;
}

function polarToXY(angleDeg, radius) {
  const rad = (angleDeg * Math.PI) / 180;
  return { x: CX + radius * Math.cos(rad), y: CY + radius * Math.sin(rad) };
}

function svgEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function drawBase(svgId, periodStart) {
  const svg = document.getElementById(svgId);
  svg.textContent = "";

  svg.appendChild(svgEl("circle", {
    cx: CX, cy: CY, r: (R + INNER_R) / 2,
    fill: "none", stroke: "#21262d",
    "stroke-width": R - INNER_R,
  }));

  for (let h = 0; h < 12; h++) {
    const angleDeg = (h / 12) * 360 - 90;

    if (h % 3 === 0) {
      const pos = polarToXY(angleDeg, LABEL_R);
      const hourVal = (Math.floor(periodStart / 60) + h) % 24;
      const text = svgEl("text", {
        x: pos.x, y: pos.y,
        "text-anchor": "middle", "dominant-baseline": "middle",
        fill: "#6b7280", "font-size": "10",
        "font-family": "system-ui, sans-serif",
      });
      text.textContent = `${hourVal}:00`;
      svg.appendChild(text);
    } else {
      const pos = polarToXY(angleDeg, R + 6);
      svg.appendChild(svgEl("circle", { cx: pos.x, cy: pos.y, r: "2", fill: "#30363d" }));
    }
  }

  const hasSeg = activities.some(a => {
    if (a.endMin < a.startMin) return true; // 日またぎは必ずAM・PM両方に存在
    return periodStart === 0 ? a.startMin < 720 : a.endMin > 720;
  });
  if (!hasSeg) {
    const hint = svgEl("text", {
      x: CX, y: CY,
      "text-anchor": "middle", "dominant-baseline": "middle",
      fill: "#30363d", "font-size": "11",
      "font-family": "system-ui, sans-serif",
    });
    hint.textContent = "活動を追加してね";
    svg.appendChild(hint);
  }
}

function renderAll() {
  renderCharts();
  renderList();
}

function drawTapIndicator(svg, tapState, hoverMin, periodStart) {
  if (hoverMin === null) return;
  const hoverAngle = timeToAngle(hoverMin, periodStart);

  if (tapState) {
    const startAngle = timeToAngle(tapState.startMin, periodStart);

    // ゴースト弧: hoverMin > startMin のときだけ描画
    if (hoverMin > tapState.startMin) {
      const span = (hoverAngle - startAngle + 360) % 360;
      const large = span > 180 ? 1 : 0;
      const oS = polarToXY(startAngle, R);
      const oE = polarToXY(hoverAngle, R);
      const iS = polarToXY(startAngle, INNER_R);
      const iE = polarToXY(hoverAngle, INNER_R);
      svg.appendChild(svgEl("path", {
        d: `M ${oS.x} ${oS.y} A ${R} ${R} 0 ${large} 1 ${oE.x} ${oE.y}` +
           ` L ${iE.x} ${iE.y} A ${INNER_R} ${INNER_R} 0 ${large} 0 ${iS.x} ${iS.y} Z`,
        fill: "#818cf8", opacity: "0.3",
      }));
    }

    // START点（青）
    const sp = polarToXY(startAngle, (R + INNER_R) / 2);
    svg.appendChild(svgEl("circle", {
      cx: sp.x, cy: sp.y, r: "7", fill: "#38bdf8",
      stroke: "#0d1117", "stroke-width": "2",
    }));
    const st = svgEl("text", {
      x: sp.x, y: sp.y, "text-anchor": "middle", "dominant-baseline": "middle",
      fill: "#0d1117", "font-size": "7", "font-family": "system-ui", "pointer-events": "none",
    });
    st.textContent = "S";
    svg.appendChild(st);
  }

  // ホバードット（tapStateなし=白、あり=緑）
  const hp = polarToXY(hoverAngle, (R + INNER_R) / 2);
  svg.appendChild(svgEl("circle", {
    cx: hp.x, cy: hp.y, r: "6",
    fill: tapState ? "#34d399" : "#fff", opacity: "0.85",
    stroke: "#0d1117", "stroke-width": "1.5",
  }));
}

function drawSeg(svg, a, actStart, actEnd, periodStart, periodEnd) {
  const segStart = Math.max(actStart, periodStart);
  const segEnd = Math.min(actEnd, periodEnd);
  if (segEnd <= segStart) return;

  const startAngle = timeToAngle(segStart, periodStart);
  const endAngle = timeToAngle(segEnd, periodStart);
  const large = endAngle - startAngle > 180 ? 1 : 0;

  const outerStart = polarToXY(startAngle, R);
  const outerEnd = polarToXY(endAngle, R);
  const innerStart = polarToXY(startAngle, INNER_R);
  const innerEnd = polarToXY(endAngle, INNER_R);

  svg.appendChild(svgEl("path", {
    d: `M ${outerStart.x} ${outerStart.y}
        A ${R} ${R} 0 ${large} 1 ${outerEnd.x} ${outerEnd.y}
        L ${innerEnd.x} ${innerEnd.y}
        A ${INNER_R} ${INNER_R} 0 ${large} 0 ${innerStart.x} ${innerStart.y}
        Z`,
    fill: a.color, opacity: "0.9",
  }));

  const arcDeg = endAngle - startAngle;
  if (arcDeg >= 15) {
    const midAngle = (startAngle + endAngle) / 2;
    const midPos = polarToXY(midAngle, (R + INNER_R) / 2);
    const label = a.name.length > 6 ? a.name.slice(0, 5) + "…" : a.name;
    const t = svgEl("text", {
      x: midPos.x, y: midPos.y,
      "text-anchor": "middle", "dominant-baseline": "middle",
      fill: "#fff", "font-size": arcDeg >= 30 ? "10" : "8",
      "font-family": "system-ui, sans-serif",
      "pointer-events": "none",
    });
    t.textContent = label;
    svg.appendChild(t);
  }
}

function drawSegments(svg, periodStart, periodEnd) {
  activities.forEach(a => {
    if (a.endMin > a.startMin) {
      drawSeg(svg, a, a.startMin, a.endMin, periodStart, periodEnd);
    } else {
      // 日またぎ: PM部分（startMin→1440）とAM部分（0→endMin）に分割
      drawSeg(svg, a, a.startMin, 1440, periodStart, periodEnd);
      drawSeg(svg, a, 0, a.endMin, periodStart, periodEnd);
    }
  });
}

function renderCharts() {
  drawBase("svg-am", 0);
  drawBase("svg-pm", 720);
  drawSegments(document.getElementById("svg-am"), 0, 720);
  drawSegments(document.getElementById("svg-pm"), 720, 1440);
}

function renderList() {
  const list = document.getElementById("activity-list");
  list.textContent = "";

  if (activities.length === 0) {
    const p = document.createElement("p");
    p.style.cssText = "font-size:0.8rem;color:#6b7280";
    p.textContent = "まだ活動がありません";
    list.appendChild(p);
    return;
  }

  activities.forEach(a => {
    const item = document.createElement("div");
    item.className = "activity-item";

    const dot = document.createElement("span");
    dot.className = "activity-dot";
    dot.style.background = a.color;

    const nameSpan = document.createElement("span");
    nameSpan.className = "activity-name";
    nameSpan.textContent = a.name;

    const timeSpan = document.createElement("span");
    timeSpan.className = "activity-time";
    timeSpan.textContent = `${minToTimeStr(a.startMin)}〜${minToTimeStr(a.endMin)}`;

    const delBtn = document.createElement("button");
    delBtn.className = "btn-del";
    delBtn.textContent = "✕";
    delBtn.setAttribute("aria-label", "削除");
    delBtn.addEventListener("click", () => deleteActivity(a.id));

    item.append(dot, nameSpan, timeSpan, delBtn);
    list.appendChild(item);
  });
}

document.getElementById("btn-add").addEventListener("click", addActivity);
loadFromStorage();
renderAll();
</script>
</body>
</html>
