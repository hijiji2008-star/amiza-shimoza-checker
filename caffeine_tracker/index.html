<!DOCTYPE html>
<html lang="ja">
<head>

  <title>カフェイン残量トラッカー</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      display: flex;
      align-items: center;
      padding: 8px 0 16px;
    }

    header h1 {
      flex: 1;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #4f46e5, #0ea5e9);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #langBtn {
      background: none;
      border: 1px solid #30363d;
      color: #8b949e;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #langBtn:hover { color: #e6edf3; border-color: #8b949e; }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 16px 20px;
    }

    .section-label {
      font-size: 11px;
      color: #8b949e;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    select, input[type="time"] {
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
    }

    select { flex: 1; min-width: 160px; }

    #hourPick, #minPick { flex: 0 0 auto; min-width: 0; width: 62px; }

    button#addBtn {
      background: linear-gradient(135deg, #4f46e5, #0ea5e9);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    button#addBtn:hover { opacity: 0.85; }

    #logList {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 12px;
    }

    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0d1117;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
    }

    .log-mg  { color: #8b949e; margin-right: 10px; }

    .del-btn {
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      line-height: 1;
    }
    .del-btn:hover { color: #e74c3c; }

    .log-empty {
      color: #484f58;
      font-size: 13px;
      text-align: center;
      padding: 8px 0;
    }

    #graphWrap {
      position: relative;
      height: 170px;
      background: #0d1117;
      border-radius: 8px;
      overflow: hidden;
    }

    #graphSvg { width: 100%; height: 100%; }

    .y-labels {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: 6px 0;
    }

    .y-label { font-size: 9px; color: #484f58; padding-left: 6px; }

    .x-labels {
      position: absolute;
      bottom: 2px; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 10px;
      pointer-events: none;
    }

    .x-label { font-size: 9px; color: #484f58; }

    #centerTimeLabel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      letter-spacing: 1px;
      color: #e6edf3;
      background: rgba(13,17,23,0.55);
      border: 1px solid rgba(48,54,61,0.7);
      padding: 6px 10px;
      border-radius: 999px;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }

    .badges {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .badge {
      background: #0d1117;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
    }

    .badge .badge-label { color: #8b949e; }
    .badge .badge-val   { color: #e6edf3; font-weight: 600; }

    #aboutText {
      font-size: 13px;
      color: #8b949e;
      line-height: 1.8;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1 id="pageTitle">カフェイン残量トラッカー</h1>
    <button id="langBtn">EN</button>
  </header>

  <div class="card">
    <div class="section-label" id="graphLabel">CAFFEINE LEVEL (mg)</div>
    <div id="graphWrap">
      <div class="y-labels" id="yLabels"></div>
      <svg id="graphSvg" viewBox="0 0 500 170" preserveAspectRatio="none">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path id="graphFill" fill="url(#grad)" d=""/>
        <path id="graphLine" fill="none" stroke="#4f46e5" stroke-width="2"/>
        <line id="line50mg" x1="12" y1="80" x2="488" y2="80"
              stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1"
              stroke-dasharray="4 5" visibility="hidden"/>
        <line id="nowLine" x1="250" y1="10" x2="250" y2="152"
              stroke="#e6edf3" stroke-opacity="0.22" stroke-width="1"/>
      </svg>
      <div id="centerTimeLabel">--:--</div>
      <div class="x-labels" id="xLabels"></div>
    </div>
    <div class="badges">
      <div class="badge" id="badge50mg">
        <span class="badge-label" id="badge50mgLabel">50mgになる時刻 </span>
        <span class="badge-val" id="badge50mgVal">—</span>
      </div>
      <div class="badge">
        <span class="badge-label" id="badgeCurrentLabel">現在 </span>
        <span class="badge-val" id="badgeCurrent">—</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-label" id="drinkLogLabel">DRINK LOG</div>
    <div class="input-row">
      <select id="drinkSel"></select>
      <select id="hourPick"></select>
      <select id="minPick"></select>
      <button id="addBtn">+ 追加</button>
    </div>
    <div id="logList"></div>
  </div>

  <div class="card">
    <div class="section-label" id="aboutLabel">ABOUT</div>
    <p id="aboutText">ドリンクを記録するだけで、体内のカフェイン残量をリアルタイムに計算します。カフェインの半減期は約5.5時間。50mgは睡眠への影響がほぼなくなるとされる目安の量です。就寝前にこの水準に達する時刻を参考に、最後の一杯のタイミングを決めましょう。</p>
  </div>

    { cat: 'Other',        id: 'cola',         label: 'Cola (350ml)',                       mg: 34  },

let currentLang = 'ja';
let DRINKS = DRINKS_I18N.ja;

function buildSelect() {
  const sel = document.getElementById('drinkSel');
  const currentVal = sel.value;
  while (sel.firstChild) sel.removeChild(sel.firstChild);
  const cats = [...new Set(DRINKS.map(d => d.cat))];
  cats.forEach(cat => {
    const grp = document.createElement('optgroup');
    grp.label = cat;
    DRINKS.filter(d => d.cat === cat).forEach(d => {
      const opt = document.createElement('option');
      opt.value       = d.id;
      opt.textContent = d.label + '  (' + d.mg + 'mg)';
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });
  if (currentVal) sel.value = currentVal;
}

function applyLang(lang) {
  DRINKS = DRINKS_I18N[lang];
  const t = TEXTS[lang];
  document.getElementById('langBtn').textContent          = t.langBtn;
  document.getElementById('pageTitle').textContent        = t.title;
  document.getElementById('drinkLogLabel').textContent    = t.drinkLogLabel;
  document.getElementById('addBtn').textContent           = t.addBtn;
  document.getElementById('graphLabel').textContent       = t.graphLabel;
  document.getElementById('badgeCurrentLabel').textContent  = t.badgeCurrentLabel;
  document.getElementById('badge50mgLabel').textContent   = t.badge50mgLabel;
  document.getElementById('aboutLabel').textContent       = t.aboutLabel;
  document.getElementById('aboutText').textContent        = t.aboutText;
  buildSelect();
  renderLog();
}

document.getElementById('langBtn').addEventListener('click', () => {
  currentLang = currentLang === 'ja' ? 'en' : 'ja';
  applyLang(currentLang);
});

(function buildTimePick() {
  const hourSel = document.getElementById('hourPick');
  const minSel  = document.getElementById('minPick');
  for (let h = 0; h < 24; h++) {
    const opt = document.createElement('option');
    opt.value = opt.textContent = String(h).padStart(2,'0');
    hourSel.appendChild(opt);
  }
  for (let m = 0; m < 60; m += 5) {
    const opt = document.createElement('option');
    opt.value = opt.textContent = String(m).padStart(2,'0');
    minSel.appendChild(opt);
  }
  const now = new Date();
  const rounded = Math.round((now.getHours() * 60 + now.getMinutes()) / 5) * 5;
  hourSel.value = String(Math.floor(rounded / 60) % 24).padStart(2,'0');
  minSel.value  = String(rounded % 60).padStart(2,'0');
})();

let entries = [];
let nextId  = 1;

function timeToHours(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  return h + m / 60;
}

function mod(n, m) {
  return ((n % m) + m) % m;
}

function hoursToHHMM(tHours) {
  const h = Math.floor(mod(tHours, 24));
  const m = Math.floor(mod(tHours, 24) * 60) % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

function localDateStr() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function saveToStorage() {
  const today = localDateStr();
  localStorage.setItem('caffeine_log', JSON.stringify({ date: today, entries, nextId }));
}

const HALF_LIFE         = 5.5;
const WINDOW_HALF_HOURS = 12;
const WINDOW_SAMPLES    = 144;

function caffeineAtContinuous(tHours) {
  return entries.reduce((sum, e) => {
    const ti = timeToHours(e.time);
    if (tHours < ti) return sum;
    return sum + e.mg * Math.pow(2, -(tHours - ti) / HALF_LIFE);
  }, 0);
}

function computeWindowPoints(nowH) {
  const start = nowH - WINDOW_HALF_HOURS;
  const end   = nowH + WINDOW_HALF_HOURS;
  const pts = [];
  for (let i = 0; i <= WINDOW_SAMPLES; i++) {
    const t = start + (i / WINDOW_SAMPLES) * (end - start);
    pts.push(caffeineAtContinuous(t));
  }
  return pts;
}

function find50mgTime(nowH) {
  const THRESHOLD = 50;
  if (caffeineAtContinuous(nowH) <= THRESHOLD) return null;
  for (let i = 1; i <= 24 * 60; i++) {
    if (caffeineAtContinuous(nowH + i / 60) <= THRESHOLD) return nowH + i / 60;
  }
  return null;
}

function renderWindowXLabels(nowH) {
  const el = document.getElementById('xLabels');
  if (!el) return;
  while (el.firstChild) el.removeChild(el.firstChild);
  const ticks = [
    nowH - WINDOW_HALF_HOURS,
    nowH - WINDOW_HALF_HOURS / 2,
    nowH,
    nowH + WINDOW_HALF_HOURS / 2,
    nowH + WINDOW_HALF_HOURS,
  ];
  ticks.forEach(t => {
    const span = document.createElement('span');
    span.className   = 'x-label';
    span.textContent = hoursToHHMM(t);
    el.appendChild(span);
  });
}

function updateGraph() {
  const now  = new Date();
  const nowH = now.getHours() + now.getMinutes() / 60;
  const pts    = computeWindowPoints(nowH);
  const maxVal = Math.max(100, ...pts);
  const W = 500, H = 170, PAD_L = 12, PAD_R = 12, PAD_T = 10, PAD_B = 18;
  const gW = W - PAD_L - PAD_R;
  const gH = H - PAD_T - PAD_B;

  const toX = i   => PAD_L + (i / WINDOW_SAMPLES) * gW;
  const toY = val => PAD_T + (1 - val / maxVal) * gH;

  const lineD = pts.map((v, i) => (i === 0 ? 'M' : 'L') + toX(i).toFixed(1) + ',' + toY(v).toFixed(1)).join(' ');
  const fillD = lineD
    + ' L' + toX(WINDOW_SAMPLES).toFixed(1) + ',' + (PAD_T + gH).toFixed(1)
    + ' L' + toX(0).toFixed(1)              + ',' + (PAD_T + gH).toFixed(1) + ' Z';

  document.getElementById('graphLine').setAttribute('d', lineD);
  document.getElementById('graphFill').setAttribute('d', fillD);

  const yLabels = document.getElementById('yLabels');
  while (yLabels.firstChild) yLabels.removeChild(yLabels.firstChild);
  [maxVal, Math.round(maxVal / 2), 0].forEach(v => {
    const span = document.createElement('span');
    span.className   = 'y-label';
    span.textContent = Math.round(v) + 'mg';
    yLabels.appendChild(span);
  });

  document.getElementById('badgeCurrent').textContent = Math.round(caffeineAtContinuous(nowH)) + 'mg';

  const nowLine = document.getElementById('nowLine');
  if (nowLine) {
    const x = PAD_L + gW / 2;
    nowLine.setAttribute('x1', x);
    nowLine.setAttribute('x2', x);
    nowLine.setAttribute('y1', PAD_T);
    nowLine.setAttribute('y2', PAD_T + gH);
  }

  const centerLabel = document.getElementById('centerTimeLabel');
  if (centerLabel) centerLabel.textContent = hoursToHHMM(nowH);

  const line50 = document.getElementById('line50mg');
  if (line50) {
    const y50 = toY(50);
    if (y50 >= PAD_T && y50 <= PAD_T + gH) {
      line50.setAttribute('y1', y50.toFixed(1));
      line50.setAttribute('y2', y50.toFixed(1));
      line50.setAttribute('x1', PAD_L);
      line50.setAttribute('x2', PAD_L + gW);
      line50.setAttribute('visibility', 'visible');
    } else {
      line50.setAttribute('visibility', 'hidden');
    }
  }

  renderWindowXLabels(nowH);

  const badge50mg    = document.getElementById('badge50mg');
  const badge50mgVal = document.getElementById('badge50mgVal');
  if (badge50mg && badge50mgVal) {
    const dropTime = find50mgTime(nowH);
    if (dropTime !== null) {
      badge50mg.style.display  = '';
      badge50mgVal.style.color = '#f59e0b';
      badge50mgVal.textContent = hoursToHHMM(dropTime);
    } else if (caffeineAtContinuous(nowH) <= 50) {
      badge50mg.style.display  = '';
      badge50mgVal.style.color = '#22c55e';
      badge50mgVal.textContent = TEXTS[currentLang].badge50mgOk;
    } else {
      badge50mg.style.display = 'none';
    }
  }
}

function addEntry() {
  const sel   = document.getElementById('drinkSel');
  const timeVal = document.getElementById('hourPick').value + ':' + document.getElementById('minPick').value;
  const drink = DRINKS.find(d => d.id === sel.value);
  if (!drink) return;
  entries.push({ id: nextId++, drink: drink.id, mg: drink.mg, time: timeVal });
  entries.sort((a, b) => timeToHours(a.time) - timeToHours(b.time));
  renderLog();
  updateGraph();
  saveToStorage();
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  renderLog();
  updateGraph();
  saveToStorage();
}

function renderLog() {
  const list = document.getElementById('logList');
  while (list.firstChild) list.removeChild(list.firstChild);

  if (entries.length === 0) {
    const empty = document.createElement('div');
    empty.className   = 'log-empty';
    empty.textContent = TEXTS[currentLang].logEmpty;
    list.appendChild(empty);
    return;
  }

  entries.forEach(e => {
    const item = document.createElement('div');
    item.className = 'log-item';

    const info = document.createElement('span');
    const drinkLabel = DRINKS.find(d => d.id === e.drink)?.label ?? e.drink;
    info.textContent = e.time + '  ' + drinkLabel;

    const right = document.createElement('span');

    const mgSpan = document.createElement('span');
    mgSpan.className   = 'log-mg';
    mgSpan.textContent = e.mg + 'mg';

    const del = document.createElement('button');
    del.className   = 'del-btn';
    del.textContent = '✕';
    del.addEventListener('click', () => deleteEntry(e.id));

    right.appendChild(mgSpan);
    right.appendChild(del);
    item.appendChild(info);
    item.appendChild(right);
    list.appendChild(item);
  });
}

document.getElementById('addBtn').addEventListener('click', addEntry);

function loadFromStorage() {
  const raw = localStorage.getItem('caffeine_log');
  if (!raw) return;
  let data;
  try {
    data = JSON.parse(raw);
  } catch {
    localStorage.removeItem('caffeine_log');
    return;
  }
  const today = localDateStr();
  if (data.date !== today || !Array.isArray(data.entries)) {
    localStorage.removeItem('caffeine_log');
    return;
  }
  entries = data.entries;
  nextId  = data.nextId ?? (entries.length ? Math.max(...entries.map(e => e.id)) + 1 : 1);
}

buildSelect();
loadFromStorage();
renderLog();
updateGraph();
setInterval(() => { try { updateGraph(); } catch (e) { console.error('updateGraph failed:', e); } }, 60_000);
</script>
